name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          # Older Ubuntu = older glibc, so the binary runs on more distros.
          - os: ubuntu-22.04
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Qt runtime libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-image0

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Build executable
        run: pyinstaller --noconfirm ClipShrinker.spec

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/ClipShrinker.exe release/ClipShrinker-windows-x64.exe

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p release pkg/ClipShrinker
          cp dist/ClipShrinker pkg/ClipShrinker/
          cp assets/clipshrinker.desktop assets/install-linux.sh pkg/ClipShrinker/
          cp clipshrinker/resources/icon.png pkg/ClipShrinker/clipshrinker.png
          chmod +x pkg/ClipShrinker/ClipShrinker pkg/ClipShrinker/install-linux.sh
          tar -C pkg -czf release/ClipShrinker-linux-x64.tar.gz ClipShrinker

      - uses: actions/upload-artifact@v4
        with:
          name: ClipShrinker-${{ matrix.platform }}
          path: release/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
