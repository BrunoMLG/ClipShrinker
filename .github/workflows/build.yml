name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          # Older Ubuntu = older glibc, so the binary runs on more distros.
          - os: ubuntu-22.04
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Qt runtime libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-image0

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Build executable
        run: pyinstaller --noconfirm ClipShrinker.spec

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/ClipShrinker.exe release/ClipShrinker-windows-x64.exe

      - name: Package AppImage (Linux)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p release
          tools/build_appimage.sh release/ClipShrinker-linux-x86_64.AppImage

      - name: Smoke-test AppImage (Linux)
        if: matrix.platform == 'linux'
        env:
          QT_QPA_PLATFORM: offscreen
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          app=release/ClipShrinker-linux-x86_64.AppImage
          # The bundled FFmpeg must be present and runnable.
          (cd build && ../$app --appimage-extract >/dev/null)
          ffmpeg_bin=$(find build/squashfs-root -path '*imageio_ffmpeg/binaries/ffmpeg-*' -type f | head -n1)
          test -n "$ffmpeg_bin"
          "$ffmpeg_bin" -hide_banner -version | head -n1
          # FFmpeg must not inherit the bundle's library path (breaks GPU drivers).
          "$app" --diagnose | tee diagnose.txt
          grep -q "LD_LIBRARY_PATH for FFmpeg: (unset)" diagnose.txt
          # The app should start and keep running until we stop it.
          set +e
          timeout 15 "$app" > app.log 2>&1
          status=$?
          set -e
          cat app.log
          if [ "$status" -ne 124 ]; then
            echo "ClipShrinker exited early with status $status"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ClipShrinker-${{ matrix.platform }}
          path: release/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
