[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "clipshrinker"
dynamic = ["version"]
description = "Batch video compressor with presets for Discord and more, powered by FFmpeg."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PySide6>=6.6", "imageio-ffmpeg>=0.5"]

[project.gui-scripts]
clipshrinker = "clipshrinker.app:main"

[tool.setuptools]
packages = ["clipshrinker", "clipshrinker.ui"]

[tool.setuptools.package-data]
clipshrinker = ["resources/*"]

[tool.setuptools.dynamic]
version = { attr = "clipshrinker.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
